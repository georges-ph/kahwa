<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Buy your favorite Lebanese creators a kahwa.">
  <meta name="theme-color" content="#630913">

  <!-- What a shared link shows in WhatsApp, Instagram and others. It is the
       same for every page: one per creator would need a server. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="kahwa">
  <meta property="og:title" content="kahwa">
  <meta property="og:description" content="Buy your favorite Lebanese creators a kahwa.">
  <meta property="og:image" content="https://shtrilekahwa.web.app/social.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kahwa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kahwa</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Dark when the user picked it in Settings, or left it to the device
    // and the device is dark. shared_preferences keeps the choice in
    // localStorage as a JSON string.
    (function () {
      var mode = null;
      try { mode = JSON.parse(localStorage.getItem('flutter.theme_mode')); } catch (e) {}
      var dark = mode === 'dark' || (mode !== 'light' &&
        window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.classList.add('dark');
    })();
  </script>
  <style>
    html, body { height: 100%; margin: 0; background: #ffffff; }

    /* Shown while Flutter downloads and starts: the app's image filling up. */
    #loading {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: #ffffff;
      color: #630913;
      font: 600 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      transition: opacity 0.3s ease;
    }

    /* The colors of the app's dark theme, when it will open dark. */
    html.dark, html.dark body, html.dark #loading { background: #0F0D10; }
    html.dark #loading { color: #D8605A; }
    html.dark #loading .fill .empty { opacity: 0.3; }

    #loading.done { opacity: 0; pointer-events: none; }

    #loading .fill { position: relative; width: 96px; height: 96px; }
    #loading .fill img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
    #loading .fill .empty { opacity: 0.2; filter: grayscale(1); }
    #loading .fill .full { animation: fill 2.2s ease-in-out infinite; }

    @keyframes fill {
      0% { clip-path: inset(100% 0 0 0); }
      70%, 100% { clip-path: inset(0 0 0 0); }
    }

    @media (prefers-reduced-motion: reduce) {
      #loading .fill .full { animation: none; }
    }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Loading kahwa">
    <div class="fill" aria-hidden="true">
      <img class="empty" src="cup.png" alt="">
      <img class="full" src="cup.png" alt="">
    </div>
    <span>Pouring your kahwa...</span>
  </div>

  <script>
    // Flutter fires this once its first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (!loading) return;
      loading.classList.add('done');
      setTimeout(function () { loading.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
