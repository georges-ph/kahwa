name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the version used locally (`flutter --version`).
          flutter-version: 3.41.5
          channel: stable
          cache: true

      # The real Firebase config is gitignored, the template has the same shape.
      - name: Create placeholder Firebase config
        run: cp lib/firebase_options.dart.example lib/firebase_options.dart

      - run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze

      - run: flutter test
