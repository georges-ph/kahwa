name: kahwa
description: "Buy your favorite Lebanese creators a kahwa."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cloud_firestore: ^6.10.0
  firebase_analytics: ^12.6.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_in_app_messaging: ^0.9.4
  firebase_performance: ^0.11.6
  flutter_svg: ^2.0.10+1
  go_router: ^17.5.0
  intl: ^0.20.3
  readmore: ^3.0.0
  share_plus: ^13.3.1
  timeago: ^3.7.0
  url_launcher: ^6.3.0
  qr_flutter: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  # Bundled so the web app does not wait on a font download to look right.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-400.ttf
          weight: 400
        - asset: assets/fonts/Manrope-500.ttf
          weight: 500
        - asset: assets/fonts/Manrope-600.ttf
          weight: 600
        - asset: assets/fonts/Manrope-700.ttf
          weight: 700
        - asset: assets/fonts/Manrope-800.ttf
          weight: 800
